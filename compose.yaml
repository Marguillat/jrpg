services:
  api:
    build: .
    ports:
      - '8080:8080'
    environment:
      - MONGODB_URI=mongodb://localhost:27017/jrpg
    networks:
      - jrpg-network

  jrpg-swagger-ui:
    image: docker.swagger.io/swaggerapi/swagger-ui:latest
    container_name: jrpg_swagger_ui
    ports:
      - '8081:8080'
    environment:
      SWAGGER_JSON: /swagger-ui/specification.yml
    volumes:
      - ./backend/docs/specification.yml:/swagger-ui/specification.yml

  frontend:
    build: ./frontend
    ports:
      - '3000:3000'
    depends_on:
      - api
    environment:
      # API_URL is used server-side by the Next.js proxy (/api/proxy/[...path]/route.ts)
      # The browser falls back to /api/proxy (same-origin) which avoids CORS issues in Docker
      - API_URL=http://api:8080
    networks:
      - jrpg-network

networks:
  jrpg-network:
    external: false
